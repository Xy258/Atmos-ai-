<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep atmospheric space background gradient -->
    <linearGradient id="atmosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Subtle border highlight -->
    <linearGradient id="atmosBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Radiant Sun Gradient -->
    <linearGradient id="solarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- AI Atmospheric Cloud Gradient -->
    <linearGradient id="cloudStream" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Neural Pulse Gradient -->
    <linearGradient id="aiSparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Atmospheric ambient glow -->
    <radialGradient id="ambientCyan" cx="65%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b132b" stop-opacity="0"/>
    </radialGradient>

    <!-- AI Core Glow Filter -->
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>

    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="64" height="64" rx="16" fill="url(#atmosBg)"/>
  <rect width="64" height="64" rx="16" fill="url(#ambientCyan)"/>
  <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="15.4" fill="none" stroke="url(#atmosBorder)" stroke-width="1.2"/>

  <!-- Weather Layer: Solar Sphere with Corona Rays -->
  <g filter="url(#sunGlow)">
    <circle cx="25" cy="25" r="9.5" fill="url(#solarGlow)"/>
  </g>

  <!-- Ambient Meteorological Arc Wave (Isobar) -->
  <path d="M11 48 C 22 45, 34 50, 53 46" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3"/>

  <!-- Main Weather Silhouette: Sleek Minimalist Cloud Form -->
  <path d="M 18 43 
           C 14 43, 11 39.8, 11 36 
           C 11 32.5, 13.8 29.5, 17.2 29.1 
           C 18.7 23.8, 23.5 20, 29.5 20 
           C 35.8 20, 41 24.2, 42.4 30.1 
           C 43.1 30, 43.8 30, 44.5 30 
           C 48.6 30, 52 33.4, 52 37.5 
           C 52 40.8, 49.7 43, 46 43 
           Z" 
        fill="url(#cloudStream)"/>

  <!-- Cloud Volume Inner Specular Arc (Atmospheric Depth) -->
  <path d="M 18 31 C 21 24.5, 27 22, 32 22 C 37.5 22, 41.5 25.5, 42.5 30.5" 
        fill="none" 
        stroke="#ffffff" 
        stroke-opacity="0.45" 
        stroke-width="1.2" 
        stroke-linecap="round"/>

  <!-- AI Synthesis Sparkle: Primary 4-Point AI Intelligence Star -->
  <g filter="url(#aiGlow)">
    <!-- Main AI Star at the atmospheric convergence vertex -->
    <path d="M 45 13 
             C 45 18, 42.5 20.5, 37.5 20.5 
             C 42.5 20.5, 45 23, 45 28 
             C 45 23, 47.5 20.5, 52.5 20.5 
             C 47.5 20.5, 45 18, 45 13 
             Z" 
          fill="url(#aiSparkGrad)"/>

    <!-- Micro AI Satellite Node -->
    <path d="M 23 15 
             C 23 17, 22 18, 20 18 
             C 22 18, 23 19, 23 21 
             C 23 19, 24 18, 26 18 
             C 24 18, 23 17, 23 15 
             Z" 
          fill="#ffffff" 
          opacity="0.9"/>
  </g>

  <!-- AI Intelligence Core Node (Luminous Center) -->
  <circle cx="45" cy="20.5" r="1.2" fill="#ffffff"/>

  <!-- Algorithmic Weather Data Node on Baseline -->
  <circle cx="34" cy="48" r="1.2" fill="#38bdf8" opacity="0.7"/>
  <circle cx="42" cy="46.8" r="1.5" fill="#7dd3fc" opacity="0.85"/>
</svg>
