<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background base with squircle corner radius -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle ambient glow circle behind sun -->
  <circle cx="210" cy="190" r="140" fill="url(#sunGlow)"/>

  <!-- Sun Sphere -->
  <circle cx="210" cy="190" r="90" fill="url(#sunCore)" filter="url(#shadow)"/>

  <!-- Atmospheric Cloud Form -->
  <g filter="url(#shadow)">
    <path d="M370 360 H180 A70 70 0 0 1 180 220 A95 95 0 0 1 350 200 A85 85 0 0 1 430 290 A70 70 0 0 1 370 360 Z" fill="url(#cloudGrad)"/>
  </g>
</svg>
