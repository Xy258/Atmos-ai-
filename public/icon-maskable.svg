<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="sunGlowMask" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunCoreMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cloudGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full bleed background for Android maskable icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>
  
  <!-- Scaled elements centered within safe 80% circle (padding ~15%) -->
  <g transform="translate(38, 38) scale(0.85)">
    <!-- Sun glow -->
    <circle cx="210" cy="190" r="140" fill="url(#sunGlowMask)"/>

    <!-- Sun Sphere -->
    <circle cx="210" cy="190" r="85" fill="url(#sunCoreMask)" filter="url(#shadowMask)"/>

    <!-- Atmospheric Cloud Form -->
    <g filter="url(#shadowMask)">
      <path d="M370 360 H180 A70 70 0 0 1 180 220 A95 95 0 0 1 350 200 A85 85 0 0 1 430 290 A70 70 0 0 1 370 360 Z" fill="url(#cloudGradMask)"/>
    </g>
  </g>
</svg>
